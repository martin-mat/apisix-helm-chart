---
# CNTi Test Suite configuration for the Apache APISIX chart in this
# repository.
config_version: "v2"
common:
  container_names:
    # Retained image tags used by the rolling update, downgrade and rollback
    # tests; the chart's appVersion is the tag under test.
    - name: apisix
      rolling_update_test_tag: "3.17.0-ubuntu"
      rolling_downgrade_test_tag: "3.16.0-ubuntu"
      rolling_version_change_test_tag: "3.17.0-ubuntu"
      rollback_from_tag: "3.17.0-ubuntu"
deployments:
  helm_dirs:
    - name: apisix
      helm_directory: charts/apisix
      namespace: apisix-cnti
      helm_values: --values ci/cnti-values.yaml
