name: CNTi cert

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: cnti-cert
  cancel-in-progress: false

jobs:
  cert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # The bundled etcd image is on Docker Hub; a login lifts the anonymous
      # pull limit when the secrets are set, and is skipped otherwise.
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      # The chart's etcd and ingress-controller dependencies are pulled from
      # their repositories; the suite installs the chart from this directory.
      - name: Build chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add apisix https://apache.github.io/apisix-helm-chart
          helm dependency build charts/apisix

      - uses: lfn-cnti/testsuite-action@v1
        with:
          # Pinned so a run is reproducible and a suite release is adopted on
          # purpose; bump it after checking the release notes.
          version: v2.0.0
          cnf_config: cnti-testsuite.yaml
          log_level: info
          install_timeout: 600
          tests: cert
