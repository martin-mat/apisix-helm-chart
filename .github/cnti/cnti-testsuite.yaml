---
# CNTi Test Suite configuration for the apisix chart, used by
# .github/workflows/cnti.yml: the chart's defaults plus values.yaml.
config_version: "v2"
deployments:
  helm_dirs:
    - name: apisix
      # Relative to this file.
      helm_directory: ../../charts/apisix
      namespace: apisix-cnti
      # Passed to helm as written, from the repository root.
      helm_values: --values .github/cnti/values.yaml
