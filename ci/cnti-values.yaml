# Values for the CNTi Test Suite run (.github/workflows/cnti.yml): resource
# limits and a declared non-root user on the gateway (the image runs as
# apisix, uid and gid 636), and the bundled etcd with the chart's three
# members (one member cannot be scaled by adding pods, and draining it takes
# the gateway down), a versioned image and its container security context on. The gateway Service keeps the
# chart's NodePort: the template always sets externalTrafficPolicy, which
# Kubernetes rejects on a ClusterIP Service.
replicaCount: 1
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 1000m, memory: 512Mi}
securityContext:
  runAsNonRoot: true
  runAsUser: 636
  runAsGroup: 636
  allowPrivilegeEscalation: false
etcd:
  image:
    tag: 3.5.21
  containerSecurityContext:
    enabled: true
